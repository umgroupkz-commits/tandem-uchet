<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1F3864">
<title>Тандем KZ — обучение работе с программой</title>
<style>
  :root{--ink:#1B2430;--ink2:#4A5568;--muted:#8A94A6;--line:#E2E7EF;--bg:#F5F7FB;
        --card:#fff;--accent:#1F3864;--accent2:#3E6EA8;--ok:#0B6B4F;--okbg:#E3F3EC;
        --bad:#B4453C;--badbg:#FBEAE8;--warnbg:#FCF3E1;--warn:#8A6412;--in:#FFFBF0;
        --spot:#F5C518}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:160px}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 20px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding-bottom:12px;border-bottom:2px solid var(--accent);margin-bottom:14px}
  h1{font-size:19px;margin:0;color:var(--accent);letter-spacing:-.2px}
  .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .back{background:none;border:none;color:var(--accent2);font-size:13.5px;padding:6px 0;
    width:auto;text-decoration:underline;font-weight:500;cursor:pointer;flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:14px;transition:box-shadow .25s,border-color .25s,opacity .25s}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    margin:0 0 12px;font-weight:700}
  label{display:block;font-size:12.5px;color:var(--ink2);margin:12px 0 5px;font-weight:600}
  label:first-of-type{margin-top:0}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:9px;font:inherit;font-size:16px;background:var(--in);color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--accent2);outline-offset:-1px;background:#fff}
  button{font:inherit;font-size:15px;font-weight:600;padding:12px 16px;border-radius:9px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;width:100%;min-height:44px}
  button.ghost{background:#fff;color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tot{display:flex;justify-content:space-between;align-items:baseline;
    padding:12px 14px;background:#EEF2F8;border-radius:9px;margin-top:14px}
  .tot span:first-child{font-size:13px;color:var(--ink2)}
  .tot span:last-child{font-size:21px;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums}
  .chk{padding:10px 12px;border-radius:8px;font-size:13.5px;margin-top:8px;font-weight:600}
  .chk.ok{background:var(--okbg);color:var(--ok)}
  .chk.bad{background:var(--badbg);color:var(--bad)}
  .trow{display:grid;grid-template-columns:1fr 66px 66px 62px;gap:6px;align-items:center;
    padding:5px 0;border-bottom:1px solid var(--line)}
  .trow.th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    font-weight:700;padding-bottom:7px}
  .trow input{padding:8px 6px;font-size:14px;text-align:center;min-height:0}
  .tn{font-size:13.5px;line-height:1.25}
  .tn i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
  .tp{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
  .tp b{display:block;font-size:11px;color:var(--accent2)}
  .srow{display:grid;grid-template-columns:1fr 30px 48px 30px 66px;gap:5px;align-items:center;
    padding:6px 0;border-bottom:1px solid var(--line)}
  .srow input{padding:8px 4px;font-size:14px;text-align:center;min-height:0}
  .srow .pm{width:30px;min-height:0;padding:8px 0;font-size:17px;font-weight:700;background:#fff;
    color:var(--accent);line-height:1}
  .spc{background:#FDF3C7 !important;border-color:#E0C24A !important}
  .fav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .fav button{width:auto;flex:0 0 auto;padding:12px 13px;font-size:13px;
    background:#EEF2F8;color:var(--accent);border:1px solid #D6DFEC}
  .rrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
    border-bottom:1px solid var(--line);font-size:13.5px}
  .rrow:last-child{border-bottom:none}
  .rrow b{font-variant-numeric:tabular-nums;font-weight:700}
  .irow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .irow.miss{background:#FFFBEF}
  .iname i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
  .iok{color:var(--ok);font-weight:600;font-size:12.5px}
  .pill{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:600;margin:0 6px 6px 0}
  .pill.bad{background:var(--badbg);color:var(--bad)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
  .demo{background:var(--warnbg);border-left:4px solid #B4801F;padding:11px 13px;
    border-radius:0 8px 8px 0;font-size:13px;color:#5C4715;margin-bottom:16px}
  .role{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;margin-bottom:11px;color:var(--ink);cursor:pointer;min-height:0}
  .role:active{border-color:var(--accent2)}
  .rn{flex:0 0 34px;height:34px;border-radius:50%;background:#EEF2F8;color:var(--accent);
    font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
  .role b{display:block;font-size:16px;color:var(--accent);margin-bottom:3px}
  .role p{margin:0;font-size:13.5px;color:var(--ink2);font-weight:400}
  body.touring .card{opacity:.38}
  body.touring .card.spot{opacity:1;border-color:var(--spot);
    box-shadow:0 0 0 3px rgba(245,197,24,.35),0 8px 24px rgba(27,36,48,.12)}
  .tour{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:2px solid var(--accent);box-shadow:0 -6px 22px rgba(27,36,48,.12);z-index:50}
  .tour-in{max-width:560px;margin:0 auto;padding:13px 14px calc(13px + env(safe-area-inset-bottom))}
  .tour-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .tour-num{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2)}
  .tour-close{width:auto;min-height:44px;padding:10px 8px;font-size:12.5px;background:none;border:none;
    color:var(--muted);text-decoration:underline;font-weight:500}
  .tour-title{font-size:16.5px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .tour-text{font-size:14.5px;color:var(--ink2);line-height:1.5}
  .tour-btns{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:11px}
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent2);transition:width .3s}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink2);background:#F2F5FA;padding:8px 9px;border-bottom:1px solid var(--line)}
  td{padding:8px 9px;border-bottom:1px solid var(--line)}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#F2F5FA;border-radius:10px;padding:12px 14px}
  .kl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .kv{font-size:20px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .kv.bad{color:var(--bad)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="pick">
  <header>
    <div>
      <h1>Как работает программа учёта</h1>
      <div class="sub">Тренажёр · ничего не сохраняется, сломать нельзя · сборка 2</div>
    </div>
  </header>
  <div class="demo"><b>Выберите свою роль</b> — покажем ваш экран и проведём по шагам. Цифры придуманы, нажимать можно что угодно. Рабочая программа открывается по другой ссылке.</div>
  <div id="roles"></div>
</div>

<div class="wrap" id="stage" hidden>
  <header>
    <div>
      <h1 id="rtitle"></h1>
      <div class="sub" id="rsub"></div>
    </div>
    <button class="back" id="toroles">← Все роли</button>
  </header>
  <div id="cards"></div>
</div>

<div class="tour" id="tour" hidden>
  <div class="tour-in">
    <div class="tour-top">
      <span class="tour-num" id="t-num"></span>
      <button type="button" class="tour-close" id="t-close">Закрыть подсказки</button>
    </div>
    <div class="tour-title" id="t-title"></div>
    <div class="tour-text" id="t-text"></div>
    <div class="tour-btns">
      <button type="button" class="ghost" id="t-prev">Назад</button>
      <button type="button" id="t-next">Дальше</button>
    </div>
    <div class="bar"><i id="t-bar"></i></div>
  </div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var fmt = function (n) { return (Math.round(Number(n || 0) * 100) / 100).toLocaleString('ru-RU'); };
var num = function (v) { var x = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(x) ? 0 : x; };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var el = function (html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; };

/* ── Демо-данные: срез настоящей номенклатуры ── */
var MENU_POS = [
  { code: '2545', name: 'Котлета 1кг говяжья', unit: 'кг', price: 1600, step: 0.5 },
  { code: '2953', name: 'Пельмени гов 1кг', unit: 'кг', price: 4250, step: 0.5 },
  { code: '3466', name: 'Вареники с вишней 0,7', unit: 'порц', price: 2980, step: 1 },
  { code: '1151', name: 'Манты1', unit: 'порц', price: 220, step: 1 },
  { code: '1570', name: 'Сосиска в тесте печ', unit: 'шт', price: 250, step: 1 },
  { code: '636',  name: 'Гамбургер розн', unit: 'шт', price: 550, step: 1 },
  { code: '2180', name: 'Компот 200гр№1', unit: 'порц', price: 100, step: 1 },
  { code: '847',  name: 'Борщ№1', unit: 'порц', price: 550, step: 1 },
  { code: '1154', name: 'Котлета говяжья 1', unit: 'порц', price: 400, step: 1 }
];
var MENU_TAKE = [
  { name: 'Борщ№1', unit: 'порц', price: 550, issued: 40, returned: 5 },
  { name: 'Гуляш говяжий№1', unit: 'порц', price: 700, issued: 30, returned: 2 },
  { name: 'Картофельное пюре№1', unit: 'порц', price: 260, issued: '', returned: '' },
  { name: 'Гречка отварная№1', unit: 'порц', price: 260, issued: '', returned: '' },
  { name: 'Котлета говяжья 1', unit: 'порц', price: 400, issued: '', returned: '' },
  { name: 'Компот в бачке', unit: 'л', price: 400, factor: 5, punit: 'стакан', pprice: 100, issued: 6, returned: 1 }
];

var sales = [], take = [];

/* ── Чек с плитками, поиском и правкой цены ── */
function cardSales() {
  return el('<div class="card" id="c-sales"><h2>Чек</h2>' +
    '<div class="fav" id="dfav"></div>' +
    '<label for="dq">Найти позицию</label><input id="dq" autocomplete="off" placeholder="Две буквы — «пель», «котл»">' +
    '<div class="hint" id="dqh"></div><div id="dres"></div><div id="dsl" style="margin-top:12px"></div>' +
    '<div class="tot"><span>Итого по чеку</span><span id="dst">0 ₸</span></div>' +
    '<div class="hint">Цена в строке — жёлтое поле: можно поправить, если продали по другой цене. Отличие от прайса руководитель увидит как скидку.</div></div>');
}
function drawSalesDemo() {
  var w = $('dsl'); if (!w) return; w.innerHTML = '';
  var sum = 0;
  sales.forEach(function (s, i) {
    sum += num(s.qty) * num(s.price);
    var changed = num(s.price) !== num(s.price_list);
    var row = el('<div class="srow"><span class="tn">' + esc(s.name) +
      '<i>' + esc(s.unit) + (changed ? ' · по прайсу ' + fmt(s.price_list) + ' ₸' : '') + '</i></span>' +
      '<button class="pm m" type="button">−</button>' +
      '<input class="q" inputmode="decimal" value="' + s.qty + '">' +
      '<button class="pm p" type="button">+</button>' +
      '<input class="pr' + (changed ? ' spc' : '') + '" inputmode="decimal" value="' + s.price + '">' +
      '</div>');
    row.querySelector('.m').onclick = function () { s.qty = Math.max(0, num(s.qty) - s.step); if (!s.qty) sales.splice(i, 1); drawSalesDemo(); };
    row.querySelector('.p').onclick = function () { s.qty = num(s.qty) + s.step; drawSalesDemo(); };
    row.querySelector('.q').oninput = function () { s.qty = this.value; drawSalesDemo(); };
    row.querySelector('.pr').oninput = function () { s.price = this.value; drawSalesDemo(); };
    w.appendChild(row);
  });
  if (!sales.length) w.innerHTML = '<div class="hint" style="text-align:center">Нажмите плитку или найдите позицию</div>';
  $('dst').textContent = fmt(sum) + ' ₸';
}
function addDemoSale(code) {
  var m = MENU_POS.filter(function (x) { return x.code === code; })[0];
  var ex = sales.filter(function (x) { return x.code === code; })[0];
  if (ex) { ex.qty = num(ex.qty) + m.step; } else {
    sales.push({ code: m.code, name: m.name, unit: m.unit, qty: m.step, step: m.step, price: m.price, price_list: m.price });
  }
  drawSalesDemo();
}
function mountSalesDemo() {
  var fav = $('dfav');
  MENU_POS.slice(0, 6).forEach(function (m) {
    var b = el('<button type="button">' + esc(m.name) + '</button>');
    b.onclick = function () { addDemoSale(m.code); };
    fav.appendChild(b);
  });
  $('dq').oninput = function () {
    var q = this.value.toLowerCase().replace(/ё/g, 'е').trim();
    var res = q.length >= 2 ? MENU_POS.filter(function (m) { return m.name.toLowerCase().indexOf(q) >= 0; }) : [];
    $('dqh').textContent = q.length >= 2 ? (res.length ? 'Найдено ' + res.length : 'Не нашлось — попробуйте часть слова') : '';
    var w = $('dres'); w.innerHTML = '';
    res.slice(0, 5).forEach(function (m) {
      var b = el('<button class="ghost" type="button" style="margin-top:6px;text-align:left">' + esc(m.name) + ' · ' + fmt(m.price) + ' ₸</button>');
      b.onclick = function () { addDemoSale(m.code); $('dq').value = ''; $('dq').dispatchEvent(new Event('input')); };
      w.appendChild(b);
    });
  };
  sales = [];
  addDemoSale('1151'); sales[0].qty = 4;
  drawSalesDemo();
}

/* ── Заборный лист ── */
function cardTake() {
  return el('<div class="card" id="c-take"><h2>Заборный лист</h2>' +
    '<button class="ghost" type="button" id="dyest" style="margin-bottom:10px">Заполнить как вчера</button>' +
    '<div id="dtk"></div>' +
    '<div class="tot"><span>Расчётная сумма по листу</span><span id="dtt">0 ₸</span></div></div>');
}
function drawTakeDemo() {
  var w = $('dtk'); if (!w) return; w.innerHTML = '';
  w.appendChild(el('<div class="trow th"><span>Позиция</span><span style="text-align:center">Выдано</span><span style="text-align:center">Остаток</span><span class="tp">Продано</span></div>'));
  var sum = 0;
  take.forEach(function (t) {
    var sold = num(t.issued) - num(t.returned);
    var small = t.factor ? Math.round(sold * t.factor * 100) / 100 : null;
    sum += small !== null ? small * t.pprice : sold * t.price;
    var row = el('<div class="trow"><span class="tn">' + esc(t.name) +
      '<i>' + esc(t.unit) + (t.factor ? ' → ' + t.factor + ' ' + esc(t.punit) + ' по ' + fmt(t.pprice) + ' ₸' : '') + '</i></span>' +
      '<input class="i" inputmode="decimal" value="' + (t.issued || '') + '">' +
      '<input class="r" inputmode="decimal" value="' + (t.returned || '') + '">' +
      '<span class="tp">' + fmt(sold) + (small !== null ? '<b>' + fmt(small) + ' ' + esc(t.punit) + '</b>' : '') + '</span></div>');
    row.querySelector('.i').oninput = function () { t.issued = this.value; drawTakeDemo(); };
    row.querySelector('.r').oninput = function () { t.returned = this.value; drawTakeDemo(); };
    w.appendChild(row);
  });
  $('dtt').textContent = fmt(sum) + ' ₸';
}
function mountTakeDemo() {
  take = MENU_TAKE.map(function (m) { return Object.assign({}, m); });
  $('dyest').onclick = function () {
    var demo = [35, 28, 30, 25, 20, 5];
    take.forEach(function (t, i) { if (!t.issued) t.issued = demo[i] || 20; });
    drawTakeDemo();
  };
  drawTakeDemo();
}

/* ── Импорт Актау ── */
function cardImport() {
  return el('<div class="card" id="c-imp"><h2>Загрузка листа продаж</h2>' +
    '<div class="hint" style="margin:0 0 11px">В заводской программе: Отчёты → Сводка по товарообороту за день → Сохранить в Excel. Потом здесь:</div>' +
    '<button type="button" id="dimp">Выбрать файл (в тренажёре — образец)</button>' +
    '<div class="hint" id="dimps"></div><div id="dimpm" style="margin-top:10px"></div>' +
    '<button type="button" id="dimpa" hidden style="margin-top:10px">Добавить в отчёт</button></div>');
}
var IMPD = [
  { name: 'БЕЛЯШ', qty: 446, full: 260, disc: 184.45, to: 'Беляш жареный №3' },
  { name: 'БУЛОЧКА С МАКОМ', qty: 914, full: 150, disc: 122.63, to: 'Булочка с маком1' },
  { name: 'Биточки с фабрики', qty: 361, full: 460, disc: 379.72, to: '' },
  { name: 'байкал 1литр', qty: 46, full: 550, disc: 550, to: 'Напиток Байкал 1л' }
];
function drawImportDemo() {
  var matched = IMPD.filter(function (r) { return r.to; }).length;
  $('dimps').textContent = 'Файл разобран. Строк: 4 · распознано: ' + matched +
    (matched < 4 ? ' · требует сопоставления: ' + (4 - matched) : '. Программа запомнила — в следующий раз сама.');
  var w = $('dimpm'); w.innerHTML = '';
  IMPD.forEach(function (r) {
    var right = r.to
      ? '<span class="iok">' + esc(r.to) + '</span>'
      : '<input placeholder="Наберите: бито…" style="padding:8px 10px;font-size:13.5px;min-height:0">';
    var row = el('<div class="irow' + (r.to ? '' : ' miss') + '"><span class="iname">' + esc(r.name) +
      '<i>' + fmt(r.qty) + ' × ' + fmt(r.disc) + ' ₸ (полная ' + fmt(r.full) + ')</i></span>' + right + '</div>');
    if (!r.to) {
      row.querySelector('input').oninput = function () {
        if (this.value.toLowerCase().indexOf('бит') >= 0) { r.to = 'Биточки паровые №3'; drawImportDemo(); }
      };
    }
    w.appendChild(row);
  });
  $('dimpa').hidden = false;
}
function mountImportDemo() {
  $('dimp').onclick = drawImportDemo;
  $('dimpa').onclick = function () {
    $('dimps').textContent = 'В отчёт добавлено 4 позиции. Скидка завода видна отдельно — полная цена хранится рядом с учётной. Осталось сохранить отчёт.';
    $('dimpm').innerHTML = ''; $('dimpa').hidden = true;
  };
}

/* ── Водитель ── */
function cardDriver() {
  return el('<div class="card" id="c-drv"><h2>Долги по точкам</h2><div id="ddl"></div>' +
    '<div class="hint">Долг = отвезено − заплачено − возвраты. Красное — больше 100 тысяч.</div></div>');
}
function cardDriverForm() {
  return el('<div class="card" id="c-drvf"><h2>Записать развоз</h2>' +
    '<label>Куда возили</label><select id="ddc"><option>Бассейн Жастар</option><option>Магазин Сабина</option><option>Рынок, отдел 16</option></select>' +
    '<div class="row2"><div><label>Отвёз по накладной, ₸</label><input id="ddd" inputmode="decimal" placeholder="0"></div>' +

      ['c-dir2', 'Деньги: каналы и юрлица', 'Выручка периода по способам оплаты и раздельно по ТОО и ИП. Фотографии кассы в WhatsApp больше не нужны — всё стеклось сюда само.'],
      ['c-dir3', 'Что продано и где скидки', 'Впервые видно продажи по позициям со всех точек — и сколько скидки роздано. Жёлтая цифра у беляша — скидка сотрудникам завода в Актау.'],
      ['c-dir4', 'Сырьё и долги', 'Расход продуктов по техкартам на проданное — для сверки со списанием. И долги по реализации из журнала водителя: бассейн должен 480 тысяч, и это видно каждый день.']
    ]
  }
};

/* ── Движок ── */
var cur = null, step = 0;

function showRoles() {
  document.body.classList.remove('touring');
  $('tour').hidden = true; $('stage').hidden = true; $('pick').hidden = false;
  window.scrollTo(0, 0);
}
function openRole(id) {
  cur = SCEN[id];
  $('pick').hidden = true; $('stage').hidden = false;
  $('rtitle').textContent = cur.title;
  $('rsub').textContent = cur.sub;
  var w = $('cards'); w.innerHTML = '';
  cur.cards.forEach(function (fn) { w.appendChild(fn()); });
  (cur.mount || []).forEach(function (fn) { try { fn(); } catch (e) { } });
  $('tour').hidden = false;
  showStep(0);
}
function showStep(i) {
  step = Math.max(0, Math.min(cur.steps.length - 1, i));
  var s = cur.steps[step];
  document.body.classList.add('touring');
  [].forEach.call(document.querySelectorAll('.card'), function (c) { c.classList.remove('spot'); });
  var c = $(s[0]);
  if (c) { c.classList.add('spot'); c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  $('t-num').textContent = 'Шаг ' + (step + 1) + ' из ' + cur.steps.length;
  $('t-title').textContent = s[1];
  $('t-text').textContent = s[2];
  $('t-prev').disabled = step === 0;
  $('t-next').textContent = step === cur.steps.length - 1 ? 'К выбору ролей' : 'Дальше';
  $('t-bar').style.width = ((step + 1) / cur.steps.length * 100) + '%';
}
$('t-next').onclick = function () { step === cur.steps.length - 1 ? showRoles() : showStep(step + 1); };
$('t-prev').onclick = function () { showStep(step - 1); };
$('t-close').onclick = function () {
  document.body.classList.remove('touring');
  [].forEach.call(document.querySelectorAll('.card'), function (c) { c.classList.remove('spot'); });
  $('tour').hidden = true;
};
$('toroles').onclick = showRoles;

ROLES.forEach(function (r) {
  var b = el('<button class="role" type="button"><span class="rn">' + r.n + '</span><span><b>' + r.t + '</b><p>' + r.p + '</p></span></button>');
  b.onclick = function () { openRole(r.id); };
  $('roles').appendChild(b);
});
</script>
