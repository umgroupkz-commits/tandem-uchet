<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3864">
<title>Тандем KZ — касса</title>
<link rel="stylesheet" href="kassa.css?v=16">
</head>
<body>
<div id="login" class="login" hidden>
  <h1>Касса · Тандем KZ</h1>
  <p class="sub">Вход для продавца · сборка 16</p>
  <label for="lpoint">Точка</label>
  <select id="lpoint"><option value="">Загружаю точки…</option></select>
  <label for="lpin">Код точки</label>
  <input id="lpin" type="password" inputmode="numeric" autocomplete="off">
  <label for="lseller">Кто за кассой</label>
  <input id="lseller" placeholder="Фамилия и инициалы" autocomplete="off">
  <button id="lbtn" class="primary big">Открыть кассу</button>
  <div class="err" id="lerr" role="alert"></div>
  <a class="link" href="index.html">Дневной отчёт точки</a>
  <a class="link" href="help.html#kassa">Памятка продавца</a>
</div>

<div id="shell" hidden>
  <header class="top">
    <div class="who">
      <div class="brand" id="pname">Касса</div>
      <button class="link" id="sellerbtn" title="Сменить продавца"></button>
    </div>
    <nav class="tabs" aria-label="Разделы кассы">
      <button id="tab-sale" aria-selected="true">Продажа</button>
      <button id="tab-shift" aria-selected="false">Смена</button>
    </nav>
    <div class="sync" id="sync" role="status"></div>
    <button class="link" id="logout">Выйти</button>
  </header>

  <main id="sale" class="sale">
    <section class="menu" aria-label="Меню точки">
      <input id="q" type="search" placeholder="Поиск: название или артикул" autocomplete="off" aria-label="Поиск позиции">
      <div class="chips" id="chips"></div>
      <div class="tiles" id="tiles"></div>
    </section>
    <aside class="receipt" id="receipt" aria-label="Чек">
      <div class="paper">
        <div class="rhead">
          <h2 id="rtitle">Чек</h2>
          <button class="link" id="rclear" hidden>Очистить</button>
          <button class="link closesheet" id="rclose">Закрыть</button>
        </div>
        <div id="rlines" class="rlines"></div>
        <div class="rtotal"><span>К оплате</span><b id="rsum">0 ₸</b></div>
      </div>
      <div class="pay" id="pay">
        <button data-pay="cash">Наличные</button>
        <button data-pay="kaspi_qr">Kaspi QR</button>
        <button data-pay="transfer">Перевод</button>
        <button data-pay="card">Карта</button>
      </div>
    </aside>
  </main>

  <main id="shift" class="shift" hidden></main>

  <button id="cartbar" class="cartbar" hidden></button>
  <div id="scrim" class="scrim" hidden></div>
  <div id="cashbox" class="cashbox" hidden role="dialog" aria-label="Оплата наличными">
    <div class="cashcard">
      <div class="cashrow"><span>К оплате</span><b id="cashsum"></b></div>
      <label for="cashgot">Дал покупатель, ₸</label>
      <input id="cashgot" inputmode="decimal" autocomplete="off">
      <div class="cashquick" id="cashquick"></div>
      <div class="cashrow big"><span>Сдача</span><b id="cashchange">—</b></div>
      <div class="cashbtns"><button id="cashcancel" type="button">Назад</button><button id="cashok" class="primary" type="button">Пробить чек</button></div>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="config.js?v=16"></script>
<script type="module" src="js/kassa/app.js?v=16"></script>
</body>
</html>
