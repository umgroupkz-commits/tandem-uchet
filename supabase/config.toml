# Настройки Supabase CLI для этого репозитория. Нужны для выкладки Edge Function uchet:
# server/README.md, раздел «Выкладка функции uchet в Supabase».
# project_id — локальное имя для CLI, а не адрес боевого проекта (его даёт --project-ref).
project_id = "tandem-uchet"

# Экраны учёта не шлют заголовок Authorization: вход, сессии и права проверяет функция базы
# tandem_gate. С проверкой JWT шлюз Supabase отвечал бы 401 ещё до кода функции — легли бы все
# экраны, а касса пометила бы очередь чеков «не принят». Поэтому проверка выключена; в команде
# выкладки — ещё и флаг --no-verify-jwt, на случай запуска CLI не из корня репозитория.
[functions.uchet]
verify_jwt = false
