# Дополнение для сервера PS.kz (213.155.20.51), где уже живут «Узел» и бот Енешки (участок «Бота заказов Енешки»).
# Запуск из ~/tandem/server:  docker compose -p tandem -f docker-compose.yml -f docker-compose.pskz.yml up -d
# Условия соседей (20.11.2026): жёсткие лимиты памяти (на сервере 1 ГБ, нехватка памяти может убить WhatsApp
# «Узла»), явные имена контейнеров, к сети дверей uzel-sites подключён только прокси - HTTPS для uchet.eneshka.kz
# даёт Caddy «Узла» (сайт заводит «Бот заказов» сценарием deploy/sayt.sh на tandem-proxy:8787).
services:
  db:
    container_name: tandem-db
    mem_limit: 160m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB",
              "-c", "maintenance_work_mem=16MB", "-c", "effective_cache_size=96MB"]
  proxy:
    container_name: tandem-proxy
    mem_limit: 96m
    environment:
      NODE_OPTIONS: --max-old-space-size=64
      # Caddy пишет адрес клиента в x-forwarded-for, а x-real-ip пропускает от клиента
      CLIENT_IP_HEADER: x-forwarded-for
    networks: [default, door]
  backup:
    container_name: tandem-backup
    mem_limit: 64m
    environment:
      BACKUP_AT: ${BACKUP_AT:-22:40}   # UTC, то есть 03:40 по Алматы; «Узел» снимает свои копии отдельно
    # Как в docker-compose.yml, но в заданное время суток, а не через сутки от запуска контейнера
    entrypoint: ["sh", "-c", "umask 077; rm -f /backups/*.tmp; s=0; while true; do if [ $$s -eq 0 ]; then n=$$(date -u +%s); t=$$(date -u -d \"$$(date -u +%F) $$BACKUP_AT\" +%s); [ $$t -le $$n ] && t=$$((t+86400)); s=$$((t-n)); fi; sleep $$s; f=/backups/tandem_$$(date +%Y%m%d_%H%M).dump; if pg_dump -h db -U tandem -d tandem -Fc -f $$f.tmp && mv $$f.tmp $$f; then echo \"$$(date '+%F %T') копия $$f\"; ls -1t /backups/tandem_*.dump | tail -n +31 | xargs -r rm --; s=0; else rm -f $$f.tmp; echo \"$$(date '+%F %T') ОШИБКА: резервная копия не снята\" >&2; s=3600; fi; done"]
networks:
  door:
    external: true
    name: uzel-sites
